# Production overrides. Anything not listed here falls back to values.yaml.
frontend:
  replicas: 4
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

backend:
  replicas: 3

database:
  storage: 5Gi

# No read-only reviewer account in prod
reviewer:
  enabled: false
