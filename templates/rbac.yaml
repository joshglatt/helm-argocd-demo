{{- range .Values.serviceAccounts }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ . }}
  namespace: {{ $.Release.Namespace }}
{{- end }}
{{- if .Values.reviewer.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: reviewer
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: reviewer
  namespace: {{ .Release.Namespace }}
rules:
  {{- toYaml .Values.reviewer.rules | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: reviewer
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: reviewer
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: reviewer
{{- end }}
