apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: database-data
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.database.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: database
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "three-tier-app.selectorLabels" "database" | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "three-tier-app.selectorLabels" "database" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "three-tier-app.selectorLabels" "database" | nindent 8 }}
    spec:
      serviceAccountName: database
      containers:
        - name: postgres
          image: "postgres:{{ .Values.database.image.tag }}"
          ports:
            - name: db
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: password
            # Subdirectory, because a fresh volume root contains lost+found
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\""]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\""]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            {{- toYaml .Values.database.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: database-data
